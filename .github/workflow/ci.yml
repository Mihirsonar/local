name: Backend CI - Kirana+ API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-check:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test --if-present

      - name: Check Server Starts
        run: |
          npm install
          timeout 10s node server.js || echo "Server start check done"